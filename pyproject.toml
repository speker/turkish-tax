[project]
name = "turkish-tax"
version = "0.1.0"
description = "Serving and quantization cost of Turkish on open LLMs: code, results, checks"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub==2.4.0",
    "numpy==2.5.4",
    "pyarrow==26.0.1",
    "regex==2026.9.29",
    "tokenizers==0.23.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
